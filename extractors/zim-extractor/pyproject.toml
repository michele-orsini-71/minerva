[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zim-extractor"
dynamic = ["version"]
description = "Standalone CLI for extracting content from ZIM archives"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Minerva Contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Topic :: Text Processing",
]
dependencies = [
    "libzim>=3.0.0",
    "markdownify>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.scripts]
zim-extractor = "zim_extractor.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "zim_extractor.__version__"}

[tool.setuptools.packages.find]
include = ["zim_extractor", "zim_extractor.*"]
