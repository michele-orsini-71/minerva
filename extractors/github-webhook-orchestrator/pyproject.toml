[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-webhook-orchestrator"
dynamic = ["version"]
description = "FastAPI webhook server for automatic repository reindexing on GitHub push events"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Minerva Contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.scripts]
webhook-orchestrator = "github_webhook_orchestrator.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "github_webhook_orchestrator.__version__"}

[tool.setuptools.packages.find]
include = ["github_webhook_orchestrator", "github_webhook_orchestrator.*"]
