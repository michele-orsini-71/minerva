[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-repo-watcher"
dynamic = ["version"]
description = "Local repository watcher for Minerva - triggers indexing on file changes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Minerva Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "watchdog>=3.0.0",
]

[project.scripts]
local-repo-watcher = "local_repo_watcher.cli:main"

[tool.setuptools.dynamic]
version = {attr = "local_repo_watcher.__version__"}

[tool.setuptools.packages.find]
include = ["local_repo_watcher", "local_repo_watcher.*"]
